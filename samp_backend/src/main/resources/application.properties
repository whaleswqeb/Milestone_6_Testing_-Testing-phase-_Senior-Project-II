# ══════════════════════════════════════════
# Server Configuration
# ══════════════════════════════════════════
server.port=8080
server.servlet.context-path=/api

# ══════════════════════════════════════════
# Database (MySQL - Local Docker / Railway Supported)
# ══════════════════════════════════════════
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/samp_db?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&serverTimezone=UTC&autoReconnect=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:manager}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ══════════════════════════════════════════
# Kafka Configuration (3-Broker KRaft Cluster on Docker Desktop)
# ══════════════════════════════════════════
spring.kafka.bootstrap-servers=localhost:9092,localhost:9093,localhost:9094
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=samp-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Kafka Topics
app.kafka.topics.student-queries=samp.student.queries
app.kafka.topics.query-replies=samp.query.replies
app.kafka.topics.notifications=samp.system.notifications

# ══════════════════════════════════════════
# Google Gemini AI / Spring AI Integration Key & Model
# ══════════════════════════════════════════


# ══════════════════════════════════════════
# JWT Authentication
# ══════════════════════════════════════════
app.jwt.secret=4b3c2a1d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b
app.jwt.expiration-ms=86400000

# ══════════════════════════════════════════
# Swagger OpenAPI & Actuator
# ══════════════════════════════════════════
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Logging
logging.level.com.samp=INFO
logging.level.org.springframework.kafka=WARN
logging.level.org.springframework.security=INFO